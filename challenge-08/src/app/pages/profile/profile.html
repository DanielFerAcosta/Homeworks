<main class="profile-page">
  <header class="profile-topbar">
    <a routerLink="/dashboard">← Volver al dashboard</a>

    <button type="button" (click)="logout()">
      Cerrar sesión
    </button>
  </header>

  <section class="profile-card">
    <div class="avatar">
      {{ authService.username().charAt(0).toUpperCase() }}
    </div>

    <p class="eyebrow">RUTA PRIVADA</p>
    <h1>Perfil de usuario</h1>

    <div class="profile-data">
      <div>
        <span>Nombre de usuario</span>
        <strong>{{ authService.username() }}</strong>
      </div>

      <div>
        <span>Correo electrónico</span>
        <strong>{{ authService.currentUser() }}</strong>
      </div>

      <div>
        <span>Estado</span>
        <strong class="status">Sesión activa</strong>
      </div>
    </div>
  </section>
</main>
