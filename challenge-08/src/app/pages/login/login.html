<main class="login-page">
  <section class="login-card">
    <div class="brand">
      <div class="brand-icon">C8</div>

      <div>
        <p class="eyebrow">ANGULAR CHALLENGE</p>
        <h1>Bienvenido</h1>
      </div>
    </div>

    <p class="description">
      Inicia sesión para acceder a las páginas privadas.
    </p>

    <form (ngSubmit)="login()" #loginForm="ngForm">
      <label for="email">Correo electrónico</label>

      <input
        id="email"
        type="email"
        name="email"
        [(ngModel)]="email"
        placeholder="user@mail.com"
        autocomplete="email"
        required
      />

      <label for="password">Contraseña</label>

      <input
        id="password"
        type="password"
        name="password"
        [(ngModel)]="password"
        placeholder="Ingresa tu contraseña"
        autocomplete="current-password"
        required
      />

      <p class="error-message" *ngIf="errorMessage">
        {{ errorMessage }}
      </p>

      <button type="submit" [disabled]="loginForm.invalid">
        Iniciar sesión
      </button>
    </form>

    <div class="demo-credentials">
      <strong>Credenciales de prueba</strong>
      <span>Correo: user@mail.com</span>
      <span>Contraseña: 123</span>
    </div>
  </section>
</main>
