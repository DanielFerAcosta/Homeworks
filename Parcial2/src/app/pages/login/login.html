<main class="pagina">
  <section class="tarjeta">
    <p class="etiqueta">PARCIAL 2</p>
    <h1>Iniciar sesión</h1>
    <p class="ayuda">
      Solo los usuarios registrados pueden crear carpetas y archivos.
    </p>


    <form #form="ngForm" (ngSubmit)="ingresar()">
      <label for="correo">Correo</label>
      <input
        id="correo"
        name="correo"
        type="email"
        [(ngModel)]="correo"
        autocomplete="username"
        [disabled]="enviando()"
        required
        email
      />


      <label for="clave">Contraseña</label>
      <input
        id="clave"
        name="clave"
        type="password"
        [(ngModel)]="clave"
        autocomplete="current-password"
        [disabled]="enviando()"
        required
      />


      @if (error()) {
        <p class="error" role="alert">{{ error() }}</p>
      }


      <button type="submit" [disabled]="form.invalid || enviando()">
        {{ enviando() ? 'Ingresando...' : 'Ingresar' }}
      </button>
    </form>


    <p class="prueba">
      Usuario de prueba:<br />
      <strong>example1@gmail.com</strong> / <strong>123456</strong>
    </p>
  </section>
</main>
