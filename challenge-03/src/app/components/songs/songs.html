<div class="songs-container">

  <h1>🎵 Music Player</h1>

  <div class="current-song" *ngIf="currentSong">

    <h2>{{ currentSong.title }}</h2>

    <p>{{ currentSong.artist }}</p>

    <span>{{ currentSong.duration }}</span>

  </div>

  <h2>Playlist</h2>

  <div class="song-list">

    <div
      class="song"
      *ngFor="let song of getSongs(); let i = index"
    >

      <div>
        <strong>{{ song.title }}</strong>
        <p>{{ song.artist }}</p>
      </div>

      <span>{{ song.duration }}</span>

      <button (click)="playSong(i)">
        ▶ Play
      </button>

    </div>

  </div>

</div>
