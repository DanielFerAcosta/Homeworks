<main class="auth-page">
  <section class="auth-card">
    <div class="brand-icon">✓</div>

    <p class="eyebrow">CHALLENGE 09</p>

    <h1>Crea tu cuenta</h1>

    <p class="description">
      Guarda tus tareas y organiza tus pendientes.
    </p>

    <form #registerForm="ngForm" (ngSubmit)="register()">
      <div class="mb-3">
        <label for="register-name" class="form-label">
          Nombre
        </label>

        <input
          id="register-name"
          class="form-control"
          type="text"
          name="name"
          [(ngModel)]="name"
          placeholder="Tu nombre"
          autocomplete="name"
          maxlength="80"
          [disabled]="submitting()"
          required
        />
      </div>

      <div class="mb-3">
        <label for="register-email" class="form-label">
          Correo electrónico
        </label>

        <input
          id="register-email"
          class="form-control"
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="nombre@correo.com"
          autocomplete="email"
          [disabled]="submitting()"
          required
          email
        />
      </div>

      <div class="mb-3">
        <label for="register-password" class="form-label">
          Contraseña
        </label>

        <input
          id="register-password"
          class="form-control"
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Mínimo 6 caracteres"
          autocomplete="new-password"
          minlength="6"
          [disabled]="submitting()"
          required
        />
      </div>

      <div class="mb-4">
        <label for="register-confirm" class="form-label">
          Confirmar contraseña
        </label>

        <input
          id="register-confirm"
          class="form-control"
          type="password"
          name="confirmPassword"
          [(ngModel)]="confirmPassword"
          placeholder="Repite tu contraseña"
          autocomplete="new-password"
          [disabled]="submitting()"
          required
        />
      </div>

      @if (errorMessage()) {
        <div class="alert alert-danger" role="alert">
          {{ errorMessage() }}
        </div>
      }

      <button
        class="btn btn-primary w-100"
        type="submit"
        [disabled]="registerForm.invalid || submitting()"
      >
        @if (submitting()) {
          <span
            class="spinner-border spinner-border-sm me-2"
            aria-hidden="true"
          ></span>
        }

        {{ submitting() ? 'Creando cuenta…' : 'Crear cuenta' }}
      </button>
    </form>

    <p class="auth-link">
      ¿Ya tienes cuenta?
      <a routerLink="/login">Iniciar sesión</a>
    </p>
  </section>
</main>
